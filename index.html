<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>少女唄日</title>
  <meta name="description" content="少女唄日 オフィシャルサイト">
  <!-- SNSでシェアされた時の表示。画像は images/ogp.jpg (1200x630) を用意 -->
  <meta property="og:title" content="少女唄日">
  <meta property="og:type" content="website">
  <meta property="og:image" content="images/ogp.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;600&family=Zen+Kaku+Gothic+New:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="site-header">
    <a class="logo" href="./">少女唄日</a>
    <nav>
      <a href="#news">お知らせ</a>
      <a href="#live">ライブ</a>
      <a href="#profile">プロフィール</a>
      <a href="#disco">音源</a>
      <a href="#contact">連絡先</a>
    </nav>
  </header>

  <main>
    <!-- トップ：写真1枚＋縦書きの名前。キャッチコピーは無理に入れない -->
    <section class="top">
      <h1 class="top-title">少女唄日</h1>
      <figure class="top-photo">
        <img src="images/top.jpg" alt="少女唄日">
      </figure>
    </section>

    <section id="news" class="block">
      <h2>お知らせ</h2>
      <ul class="news">
        <!-- 新しいものを上に追加 -->
        <li><time datetime="2026-11-20">2026.11.20</time><span>ホームページを作りました。</span></li>
      </ul>
    </section>

    <section id="live" class="block">
      <h2>ライブ</h2>
      <table class="live">
        <tr>
          <th><time datetime="2026-12-24">12.24</time><small>水</small></th>
          <td>
            <strong>公演名</strong>
            会場名 ／ 開場 18:00 開演 18:30<br>
            前売 ¥0,000 ＋1D
          </td>
        </tr>
      </table>
    </section>

    <section id="profile" class="block">
      <h2>プロフィール</h2>
      <div class="profile">
        <img src="images/profile.jpg" alt="">
        <p>
          <!-- ここは自分たちの言葉で。結成のきっかけや、普段の話し方そのままでOK -->
          ここに紹介文。
        </p>
      </div>
    </section>

    <section id="disco" class="block">
      <h2>音源</h2>
      <ul class="disco">
        <li>
          <img src="images/jacket01.jpg" alt="">
          <p>タイトル<small>2026.00.00 ／ 配信</small></p>
        </li>
      </ul>
    </section>

    <section id="contact" class="block">
      <h2>連絡先</h2>
      <p>出演依頼・お問い合わせ：<a href="mailto:example@example.com">example@example.com</a></p>
      <p class="sns">
        <a href="#">X</a>
        <a href="#">Instagram</a>
        <a href="#">YouTube</a>
      </p>
    </section>
  </main>

  <footer class="site-footer">
    <small>&copy; 少女唄日</small>
  </footer>

</body>
</html>
